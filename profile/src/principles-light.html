<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#FFFFFF;--card:#F5F7FB;--cardb:rgba(20,40,70,.08);--ink:#142846;--ink2:#56657D;--q:#142846;--acc:#5B6E8F}
body.dark{--bg:#0D1117;--card:#161D2B;--cardb:rgba(255,255,255,.08);--ink:#F2F5F9;--ink2:#9AA8BE;--q:#FFCF4B;--acc:#FFCF4B}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:510px;font-family:Pretendard,sans-serif;background:var(--bg);overflow:hidden;word-break:keep-all}
.w{padding:40px 56px}
.head{display:flex;align-items:baseline;gap:16px}
.head b{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.head span{font-size:17px;color:var(--ink2)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
.c{position:relative;padding:24px 30px 26px;border-radius:18px;background:var(--card);border:1px solid var(--cardb)}
.n{display:inline-block;font-size:14px;font-weight:800;letter-spacing:.1em;color:var(--acc)}
.q{position:absolute;left:24px;top:46px;font-size:64px;line-height:1;font-weight:800;color:var(--q);opacity:.9}
.h{margin-top:8px;font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.d{margin-top:12px;font-size:17px;line-height:1.65;color:var(--ink2);letter-spacing:-.01em}
</style></head><body class="light"><div class="w">
<div class="head"><b>만드는 원칙</b><span>코드 리뷰와 설계에서 늘 먼저 묻는 것</span></div>
<div class="g">
<div class="c"><div class="n">01</div><div class="h">모름을 0으로 바꾸지 않는다</div><div class="d">값이 없으면 「모름」으로 둔다.<br>보고가 없는 사람을 「정상」으로 보이게 하지 않는다.</div></div>
<div class="c"><div class="n">02</div><div class="h">조용히 실패하지 않는다</div><div class="d">아무에게도 가지 않은 경보, 덮여 사라진 확인은<br>반드시 드러나야 한다.</div></div>
<div class="c"><div class="n">03</div><div class="h">경보는 배터리보다 먼저다</div><div class="d">절전은 측정 주기를 늦출 뿐,<br>낙상 감지와 경보 수신은 늦추지 않는다.</div></div>
<div class="c"><div class="n">04</div><div class="h">같은 값도 맥락이 다르다</div><div class="d">휴게실의 무동작과 밀폐공간의 무동작은<br>다른 경보다.</div></div>
</div></div></body></html>
